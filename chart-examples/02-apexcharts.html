<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>ApexCharts - Dashboard Multi-Métrica</title>
  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
  <style>
    body { font-family: system-ui; max-width: 1200px; margin: 40px auto; padding: 0 20px; background: #0f172a; color: #e2e8f0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 24px; }
    .card { background: #1e293b; border-radius: 12px; padding: 24px; box-shadow: 0 4px 24px rgba(0,0,0,0.3); }
    .card h3 { margin: 0 0 16px; font-size: 1.1rem; font-weight: 600; color: #94a3b8; }
    #areaChart { height: 300px; }
    #barChart { height: 300px; }
    #donutChart { height: 300px; }
  </style>
</head>
<body>
  <h1 style="color:#fff">📈 ApexCharts — Dashboard Ambiental Multi-Métrica</h1>
  <div class="grid">
    <div class="card">
      <h3>PM2.5 + PM10 + O₃ (24h)</h3>
      <div id="areaChart"></div>
    </div>
    <div class="card">
      <h3>Alertas por Severidad (Semana)</h3>
      <div id="barChart"></div>
    </div>
    <div class="card">
      <h3>Fuentes de Contaminación</h3>
      <div id="donutChart"></div>
    </div>
  </div>
  <script>
    // Area Chart - Multi-series
    new ApexCharts(document.querySelector("#areaChart"), {
      chart: { type: 'area', height: 300, toolbar: { show: false }, background: 'transparent' },
      colors: ['#ef4444', '#f97316', '#22d3ee'],
      dataLabels: { enabled: false },
      stroke: { curve: 'smooth', width: 2 },
      fill: { type: 'gradient', gradient: { shadeIntensity: 1, opacityFrom: 0.4, opacityTo: 0.05, stops: [0, 100] } },
      series: [
        { name: 'PM2.5', data: [12,15,18,22,28,35,42,38,30,25,20,18,16,14,12,11,10,12,15,18,22,25,20,16] },
        { name: 'PM10', data: [25,28,32,38,45,52,58,55,48,42,38,35,32,28,25,24,22,25,28,32,38,42,38,32] },
        { name: 'O₃', data: [45,48,52,58,65,72,78,75,68,62,58,55,52,48,45,44,42,45,48,52,58,62,58,52] }
      ],
      xaxis: { categories: Array.from({length:24},(_,i)=>`${i}:00`), labels: { style: { colors: '#94a3b8' } }, axisBorder: { show: false } },
      yaxis: { labels: { style: { colors: '#94a3b8' } } },
      grid: { borderColor: '#334155', xaxis: { lines: { show: false } } },
      legend: { position: 'top', labels: { colors: '#94a3b8' } },
      tooltip: { theme: 'dark' }
    }).render();

    // Bar Chart - Alertas
    new ApexCharts(document.querySelector("#barChart"), {
      chart: { type: 'bar', height: 300, toolbar: { show: false }, background: 'transparent' },
      colors: ['#22c55e', '#f59e0b', '#ef4444', '#dc2626'],
      plotOptions: { bar: { borderRadius: 6, columnWidth: '60%', distributed: true } },
      series: [{ name: 'Alertas', data: [12, 8, 5, 2] }],
      xaxis: { categories: ['Info', 'Warning', 'Critical', 'Emergency'], labels: { style: { colors: '#94a3b8' } } },
      yaxis: { labels: { style: { colors: '#94a3b8' } } },
      grid: { borderColor: '#334155' },
      tooltip: { theme: 'dark' }
    }).render();

    // Donut Chart
    new ApexCharts(document.querySelector("#donutChart"), {
      chart: { type: 'donut', height: 300, background: 'transparent' },
      colors: ['#ef4444', '#f97316', '#eab308', '#22c55e', '#3b82f6'],
      series: [35, 25, 20, 12, 8],
      labels: ['Tráfico', 'Industria', 'Construcción', 'Residencial', 'Natural'],
      legend: { position: 'bottom', labels: { colors: '#94a3b8' } },
      tooltip: { theme: 'dark' }
    }).render();
  </script>
</body>
</html>
