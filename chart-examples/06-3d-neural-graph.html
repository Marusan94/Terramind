<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>3D Neural Graph - Live Variables</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      background: #0a0a0f; 
      color: #e2e8f0; 
      font-family: 'Inter', system-ui; 
      overflow: hidden; 
      height: 100vh; 
    }
    #canvas { display: block; }
    .hud {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 100;
      background: rgba(10, 10, 15, 0.9);
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 20px;
      backdrop-filter: blur(10px);
      min-width: 280px;
    }
    .hud h1 { font-size: 1.1rem; font-weight: 700; margin-bottom: 16px; background: linear-gradient(135deg, #3b82f6, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .hud-row { display: flex; justify-content: space-between; margin: 8px 0; font-size: 0.85rem; }
    .hud-label { color: #64748b; }
    .hud-value { font-weight: 600; color: #fff; font-variant-numeric: tabular-nums; }
    .controls { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px; z-index: 100; }
    .btn { padding: 10px 20px; background: rgba(15, 23, 42, 0.9); border: 1px solid #334155; color: #e2e8f0; border-radius: 8px; cursor: pointer; font-size: 0.85rem; backdrop-filter: blur(10px); transition: all 0.2s; }
    .btn:hover { background: #1e293b; border-color: #475569; }
    .btn.active { background: #3b82f6; border-color: #3b82f6; }
    .legend { position: fixed; top: 20px; right: 20px; z-index: 100; background: rgba(10, 10, 15, 0.9); border: 1px solid #1e293b; border-radius: 12px; padding: 16px; backdrop-filter: blur(10px); }
    .legend-item { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 0.8rem; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
    .node-info { position: fixed; bottom: 20px; right: 20px; z-index: 100; background: rgba(10, 10, 15, 0.95); border: 1px solid #334155; border-radius: 12px; padding: 20px; backdrop-filter: blur(10px); min-width: 260px; max-width: 320px; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
    .node-info.visible { opacity: 1; pointer-events: auto; }
    .node-info h3 { font-size: 1rem; margin-bottom: 12px; color: #3b82f6; }
    .node-info .metric { display: flex; justify-content: space-between; margin: 6px 0; font-size: 0.85rem; }
    .node-info .metric-label { color: #64748b; }
    .node-info .metric-value { font-weight: 600; }
    @media (max-width: 900px) { .hud { left: 10px; right: 10px; top: 10px; min-width: auto; } .legend { right: 10px; top: 140px; } .controls { bottom: 10px; } }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  
  <div class="hud">
    <h1>🧠 Neural Graph Live</h1>
    <div class="hud-row"><span class="hud-label">Nodos (neuronas)</span><span class="hud-value" id="nodeCount">0</span></div>
    <div class="hud-row"><span class="hud-label">Conexiones (sinapsis)</span><span class="hud-value" id="edgeCount">0</span></div>
    <div class="hud-row"><span class="hud-label">Actividad global</span><span class="hud-value" id="globalActivity">0%</span></div>
    <div class="hud-row"><span class="hud-label">FPS</span><span class="hud-value" id="fps">0</span></div>
    <div class="hud-row"><span class="hud-label">Modo</span><span class="hud-value" id="modeLabel">Force</span></div>
  </div>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#3b82f6"></div><span>Input / Sensores</span></div>
    <div class="legend-item"><div class="legend-dot" style="background:#a855f7"></div><span>Hidden / Procesamiento</span></div>
    <div class="legend-item"><div class="legend-dot" style="background:#22c55e"></div><span>Output / Decisiones</span></div>
    <div class="legend-item"><div class="legend-dot" style="background:#f59e0b"></div><span>Attention / Gate</span></div>
    <div class="legend-item"><div class="legend-dot" style="background:#ef4444"></div><span>Alerta / Anomalía</span></div>
  </div>

  <div class="controls">
    <button class="btn active" data-mode="force">🌐 Force Directed</button>
    <button class="btn" data-mode="sphere">🔮 Esfera</button>
    <button class="btn" data-mode="layers">📐 Capas (NN)</button>
    <button class="btn" data-mode="spiral">🌀 Espiral</button>
    <button class="btn" id="btnPause">⏸️ Pausar</button>
    <button class="btn" id="btnReset">🔄 Reset</button>
  </div>

  <div class="node-info" id="nodeInfo">
    <h3 id="infoName">Neurona</h3>
    <div class="metric"><span class="metric-label">ID</span><span class="metric-value" id="infoId">-</span></div>
    <div class="metric"><span class="metric-label">Tipo</span><span class="metric-value" id="infoType">-</span></div>
    <div class="metric"><span class="metric-label">Activación</span><span class="metric-value" id="infoActivation">0.00</span></div>
    <div class="metric"><span class="metric-label">Entradas</span><span class="metric-value" id="infoIn">0</span></div>
    <div class="metric"><span class="metric-label">Salidas</span><span class="metric-value" id="infoOut">0</span></div>
    <div class="metric"><span class="metric-label">Valor Live</span><span class="metric-value" id="infoLive">0.000</span></div>
    <div class="metric"><span class="metric-label">Bias</span><span class="metric-value" id="infoBias">0.00</span></div>
    <div class="metric"><span class="metric-label">Posición 3D</span><span class="metric-value" id="infoPos">(0, 0, 0)</span></div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.165/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.165/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ========== CONFIG ==========
    const CONFIG = {
      nodeCount: 180,
      connectionProbability: 0.025,
      maxConnections: 4,
      forceStrength: 0.008,
      repulsionStrength: 1.2,
      centerForce: 0.003,
      damping: 0.92,
      nodeSizeRange: [3, 10],
      liveUpdateInterval: 50,
      sphereRadius: 80,
      layerSpacing: 45,
      spiralTurns: 3,
      spiralHeight: 120,
    };

    // ========== TIPOS DE NODOS (estilo red neuronal) ==========
    const NODE_TYPES = {
      INPUT: { color: 0x3b82f6, label: 'Input', emoji: '📥', baseSize: 5 },
      HIDDEN: { color: 0xa855f7, label: 'Hidden', emoji: '⚙️', baseSize: 4 },
      OUTPUT: { color: 0x22c55e, label: 'Output', emoji: '📤', baseSize: 5 },
      ATTENTION: { color: 0xf59e0b, label: 'Attention', emoji: '🔍', baseSize: 4.5 },
      ANOMALY: { color: 0xef4444, label: 'Anomaly', emoji: '⚠️', baseSize: 4 },
    };

    // ========== THREE SETUP ==========
    const canvas = document.getElementById('canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x0a0a0f, 1);

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0a0a0f, 0.0015);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 2000);
    camera.position.set(0, 0, 200);

    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.enablePan = true;
    controls.minDistance = 30;
    controls.maxDistance = 500;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.3;

    // ========== LUZ ==========
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);

    const dirLight1 = new THREE.DirectionalLight(0x3b82f6, 0.8);
    dirLight1.position.set(100, 100, 100);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0xa855f7, 0.5);
    dirLight2.position.set(-100, 50, -100);
    scene.add(dirLight2);

    const pointLight = new THREE.PointLight(0xffffff, 0.3, 300);
    pointLight.position.set(0, 0, 0);
    scene.add(pointLight);

    // ========== DATOS DE NODOS ==========
    const nodes = [];
    const edges = [];
    const adjacency = new Map();

    // Crear nodos con distribución por capas (input → hidden → output)
    const layerCounts = [
      { type: 'INPUT', count: Math.floor(CONFIG.nodeCount * 0.15) },
      { type: 'HIDDEN', count: Math.floor(CONFIG.nodeCount * 0.6) },
      { type: 'ATTENTION', count: Math.floor(CONFIG.nodeCount * 0.1) },
      { type: 'OUTPUT', count: Math.floor(CONFIG.nodeCount * 0.1) },
      { type: 'ANOMALY', count: Math.floor(CONFIG.nodeCount * 0.05) },
    ];

    let nodeId = 0;
    layerCounts.forEach((layer, layerIndex) => {
      for (let i = 0; i < layer.count; i++) {
        const typeDef = NODE_TYPES[layer.type];
        const node = {
          id: nodeId++,
          type: layer.type,
          typeDef,
          layer: layerIndex,
          // Posición inicial
          x: (Math.random() - 0.5) * 200,
          y: (Math.random() - 0.5) * 200,
          z: (Math.random() - 0.5) * 200,
          // Velocidad para force-directed
          vx: 0, vy: 0, vz: 0,
          // Estado neural
          activation: Math.random() * 0.3,
          bias: (Math.random() - 0.5) * 0.5,
          liveValue: Math.random(),
          targetActivation: Math.random() * 0.3,
          // Visual
          mesh: null,
          labelSprite: null,
          // Conexiones
          connections: [],
          weights: [],
        };
        nodes.push(node);
        adjacency.set(node.id, []);
      }
    });

    // Crear conexiones (feed-forward + recurrentes + skip)
    nodes.forEach(node => {
      const maxConns = Math.min(CONFIG.maxConnections, nodes.length - 1);
      const connCount = Math.floor(Math.random() * maxConns) + 1;
      
      for (let c = 0; c < connCount; c++) {
        // Preferir conexiones feed-forward (hacia capas superiores) y recurrentes
        let target;
        const rand = Math.random();
        if (rand < 0.6 && node.layer < layerCounts.length - 1) {
          // Feed-forward
          const nextLayers = nodes.filter(n => n.layer > node.layer);
          target = nextLayers[Math.floor(Math.random() * nextLayers.length)];
        } else if (rand < 0.85) {
          // Recurrente / lateral (misma capa o cercana)
          const sameLayer = nodes.filter(n => n.layer === node.layer && n.id !== node.id);
          target = sameLayer.length > 0 ? sameLayer[Math.floor(Math.random() * sameLayer.length)] : null;
        } else {
          // Skip connection (saltar capas)
          const forwardLayers = nodes.filter(n => n.layer > node.layer + 1);
          target = forwardLayers.length > 0 ? forwardLayers[Math.floor(Math.random() * forwardLayers.length)] : null;
        }

        if (target && !adjacency.get(node.id).includes(target.id)) {
          const weight = (Math.random() - 0.5) * 2;
          adjacency.get(node.id).push(target.id);
          node.connections.push(target.id);
          node.weights.push(weight);
          
          // Bidireccional para visualización
          adjacency.get(target.id).push(node.id);
          edges.push({ source: node.id, target: target.id, weight, active: false, pulse: 0 });
        }
      }
    });

    // ========== CREAR MESHES ==========
    const nodeGroup = new THREE.Group();
    const edgeGroup = new THREE.Group();
    scene.add(nodeGroup);
    scene.add(edgeGroup);

    // Geometrías compartidas
    const sphereGeom = new THREE.SphereGeometry(1, 16, 16);
    const glowGeom = new THREE.SphereGeometry(1.3, 8, 8);

    // Material base para nodos
    function createNodeMaterial(color, emissiveIntensity = 0.3) {
      return new THREE.MeshStandardMaterial({
        color,
        emissive: new THREE.Color(color),
        emissiveIntensity,
        metalness: 0.2,
        roughness: 0.6,
        transparent: true,
        opacity: 0.95,
      });
    }

    // Material glow
    function createGlowMaterial(color) {
      return new THREE.MeshBasicMaterial({
        color,
        transparent: true,
        opacity: 0.15,
        side: THREE.BackSide,
        depthWrite: false,
      });
    }

    // Crear meshes para cada nodo
    nodes.forEach(node => {
      const size = node.typeDef.baseSize + Math.random() * 2;
      
      // Mesh principal
      const material = createNodeMaterial(node.typeDef.color);
      const mesh = new THREE.Mesh(sphereGeom, material);
      mesh.scale.setScalar(size);
      mesh.position.set(node.x, node.y, node.z);
      mesh.userData = { nodeId: node.id };
      node.mesh = mesh;
      nodeGroup.add(mesh);

      // Glow externo
      const glowMat = createGlowMaterial(node.typeDef.color);
      const glow = new THREE.Mesh(glowGeom, glowMat);
      glow.scale.setScalar(size * 1.5);
      glow.position.copy(mesh.position);
      node.glow = glow;
      nodeGroup.add(glow);

      // Sprite para etiqueta (opcional, solo para nodos importantes)
      if (node.type === 'ATTENTION' || node.type === 'ANOMALY' || (node.type === 'OUTPUT' && Math.random() < 0.3)) {
        const canvas2d = document.createElement('canvas');
        canvas2d.width = 128; canvas2d.height = 48;
        const ctx2d = canvas2d.getContext('2d');
        ctx2d.font = 'bold 24px Inter, system-ui';
        ctx2d.fillStyle = '#fff';
        ctx2d.textAlign = 'center';
        ctx2d.fillText(`${node.typeDef.emoji} ${node.typeDef.label}`, 64, 30);
        const texture = new THREE.CanvasTexture(canvas2d);
        texture.needsUpdate = true;
        const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false });
        const sprite = new THREE.Sprite(spriteMat);
        sprite.scale.set(30, 11, 1);
        sprite.position.set(node.x, node.y + size + 6, node.z);
        node.labelSprite = sprite;
        nodeGroup.add(sprite);
      }
    });

    // ========== EDGES (LÍNEAS) ==========
    const edgeMaterial = new THREE.LineBasicMaterial({ 
      vertexColors: true, 
      transparent: true, 
      opacity: 0.3,
      blending: THREE.AdditiveBlending,
    });

    // Buffer geometry para todas las edges
    const maxEdges = edges.length;
    const edgePositions = new Float32Array(maxEdges * 6);
    const edgeColors = new Float32Array(maxEdges * 6);
    const edgeGeometry = new THREE.BufferGeometry();
    edgeGeometry.setAttribute('position', new THREE.BufferAttribute(edgePositions, 3));
    edgeGeometry.setAttribute('color', new THREE.BufferAttribute(edgeColors, 3));
    
    const edgeMesh = new THREE.LineSegments(edgeGeometry, edgeMaterial);
    edgeGroup.add(edgeMesh);

    // ========== PARTÍCULAS DE FONDO (estilo espacio) ==========
    const starCount = 2000;
    const starGeom = new THREE.BufferGeometry();
    const starPositions = new Float32Array(starCount * 3);
    const starColors = new Float32Array(starCount * 3);
    const starSizes = new Float32Array(starCount);
    
    for (let i = 0; i < starCount; i++) {
      const r = 150 + Math.random() * 200;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      starPositions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
      starPositions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
      starPositions[i * 3 + 2] = r * Math.cos(phi);
      
      const colorChoice = Math.random();
      if (colorChoice < 0.4) { starColors[i*3]=0.23; starColors[i*3+1]=0.51; starColors[i*3+2]=0.96; } // blue
      else if (colorChoice < 0.7) { starColors[i*3]=0.66; starColors[i*3+1]=0.33; starColors[i*3+2]=0.96; } // purple
      else { starColors[i*3]=0.13; starColors[i*3+1]=0.76; starColors[i*3+2]=0.37; } // green
      starSizes[i] = Math.random() * 1.5 + 0.5;
    }
    
    starGeom.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    starGeom.setAttribute('color', new THREE.BufferAttribute(starColors, 3));
    starGeom.setAttribute('size', new THREE.BufferAttribute(starSizes, 1));
    
    const starMat = new THREE.PointsMaterial({
      size: 1.5,
      vertexColors: true,
      transparent: true,
      opacity: 0.6,
      sizeAttenuation: true,
      blending: THREE.AdditiveBlending,
    });
    
    const stars = new THREE.Points(starGeom, starMat);
    scene.add(stars);

    // ========== PARTÍCULAS DE PULSO (señales viajando) ==========
    const pulseParticles = [];
    const pulseGeom = new THREE.SphereGeometry(0.4, 6, 6);
    
    function spawnPulse(sourceNode, targetNode, weight) {
      const particle = new THREE.Mesh(pulseGeom, new THREE.MeshBasicMaterial({
        color: weight > 0 ? 0x22c55e : 0xef4444,
        transparent: true,
        opacity: 0.8,
        blending: THREE.AdditiveBlending,
      }));
      particle.position.copy(sourceNode.mesh.position);
      particle.userData = {
        source: sourceNode,
        target: targetNode,
        progress: 0,
        speed: 0.015 + Math.random() * 0.01,
        weight: weight,
        startTime: Date.now(),
      };
      scene.add(particle);
      pulseParticles.push(particle);
    }

    // ========== ESTADO DE LA APP ==========
    let currentMode = 'force';
    let isPaused = false;
    let lastTime = performance.now();
    let frameCount = 0;
    let fps = 60;
    let selectedNode = null;
    let raycaster = new THREE.Raycaster();
    raycaster.params.Points.threshold = 0.1;

    // ========== POSICIONAMIENTO POR MODO ==========
    function applyLayout(mode, instant = false) {
      currentMode = mode;
      
      nodes.forEach((node, i) => {
        let targetX, targetY, targetZ;
        
        switch (mode) {
          case 'sphere':
            const phi = Math.acos(2 * (i / nodes.length) - 1);
            const theta = Math.PI * (3 - Math.sqrt(5)) * i;
            const r = CONFIG.sphereRadius * (0.7 + 0.3 * Math.random());
            targetX = r * Math.sin(phi) * Math.cos(theta);
            targetY = r * Math.sin(phi) * Math.sin(theta);
            targetZ = r * Math.cos(phi);
            break;
            
          case 'layers':
            const layerNodes = nodes.filter(n => n.layer === node.layer);
            const layerIndex = layerNodes.indexOf(node);
            const totalInLayer = layerNodes.length;
            const angle = (layerIndex / Math.max(1, totalInLayer)) * Math.PI * 2;
            const radius = 40 + node.layer * 25;
            targetX = Math.cos(angle) * radius;
            targetY = (node.layer - 2) * CONFIG.layerSpacing;
            targetZ = Math.sin(angle) * radius;
            break;
            
          case 'spiral':
            const t = i / nodes.length * CONFIG.spiralTurns * Math.PI * 2;
            const rSpiral = 30 + t * 4;
            targetX = Math.cos(t) * rSpiral;
            targetY = (i / nodes.length - 0.5) * CONFIG.spiralHeight;
            targetZ = Math.sin(t) * rSpiral;
            break;
            
          case 'force':
          default:
            // En force-directed, no hay target fijo, las fuerzas lo manejan
            return;
        }
        
        if (instant) {
          node.x = targetX; node.y = targetY; node.z = targetZ;
          node.mesh.position.set(targetX, targetY, targetZ);
          if (node.glow) node.glow.position.set(targetX, targetY, targetZ);
          if (node.labelSprite) node.labelSprite.position.set(targetX, targetY + node.typeDef.baseSize + 6, targetZ);
        } else {
          node.targetX = targetX; node.targetY = targetY; node.targetZ = targetZ;
        }
      });
    }

    // Inicial: force-directed con posiciones aleatorias
    applyLayout('force', true);

    // ========== FORCE-DIRECTED SIMULATION ==========
    function simulateForces(dt) {
      if (currentMode !== 'force') return;
      
      // Repulsión entre todos los nodos (Barnes-Hut approximation simplificada)
      for (let i = 0; i < nodes.length; i++) {
        const a = nodes[i];
        let fx = 0, fy = 0, fz = 0;
        
        // Repulsión de nodos cercanos (solo muestra para performance)
        const nearbyCount = Math.min(30, nodes.length - 1);
        for (let k = 0; k < nearbyCount; k++) {
          const j = (i + 1 + Math.floor(Math.random() * (nodes.length - 1))) % nodes.length;
          const b = nodes[j];
          if (a === b) continue;
          
          const dx = a.x - b.x;
          const dy = a.y - b.y;
          const dz = a.z - b.z;
          const dist2 = dx*dx + dy*dy + dz*dz + 1;
          const dist = Math.sqrt(dist2);
          const force = CONFIG.repulsionStrength * (a.typeDef.baseSize + b.typeDef.baseSize) / dist2;
          
          fx += (dx / dist) * force;
          fy += (dy / dist) * force;
          fz += (dz / dist) * force;
        }
        
        // Atracción por edges
        a.connections.forEach((targetId, idx) => {
          const target = nodes[targetId];
          if (!target) return;
          const dx = target.x - a.x;
          const dy = target.y - a.y;
          const dz = target.z - a.z;
          const dist = Math.sqrt(dx*dx + dy*dy + dz*dz) + 0.1;
          const force = CONFIG.forceStrength * Math.abs(a.weights[idx]) * dist;
          fx += (dx / dist) * force;
          fy += (dy / dist) * force;
          fz += (dz / dist) * force;
        });
        
        // Fuerza central (mantener grafo junto)
        const distCenter = Math.sqrt(a.x*a.x + a.y*a.y + a.z*a.z);
        if (distCenter > 1) {
          fx -= (a.x / distCenter) * CONFIG.centerForce * distCenter;
          fy -= (a.y / distCenter) * CONFIG.centerForce * distCenter;
          fz -= (a.z / distCenter) * CONFIG.centerForce * distCenter;
        }
        
        // Integrar
        a.vx = (a.vx + fx * dt) * CONFIG.damping;
        a.vy = (a.vy + fy * dt) * CONFIG.damping;
        a.vz = (a.vz + fz * dt) * CONFIG.damping;
        
        a.x += a.vx * dt;
        a.y += a.vy * dt;
        a.z += a.vz * dt;
      }
      
      // Para modos con target, atraer hacia target
      if (currentMode !== 'force') {
        nodes.forEach(node => {
          if (node.targetX !== undefined) {
            const dx = node.targetX - node.x;
            const dy = node.targetY - node.y;
            const dz = node.targetZ - node.z;
            const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
            if (dist > 0.5) {
              node.vx += (dx / dist) * 0.5;
              node.vy += (dy / dist) * 0.5;
              node.vz += (dz / dist) * 0.5;
            } else {
              node.vx *= 0.5; node.vy *= 0.5; node.vz *= 0.5;
            }
          }
        });
      }
    }

    // ========== ACTUALIZACIÓN NEURAL (LIVE) ==========
    function updateNeural(dt) {
      // Propagación de activación (simplificada)
      nodes.forEach(node => {
        // Decay hacia target
        node.activation += (node.targetActivation - node.activation) * 0.02;
        
        // Ruido / variación natural
        node.targetActivation += (Math.random() - 0.5) * 0.02;
        node.targetActivation = THREE.MathUtils.clamp(node.targetActivation, 0, 1);
        
        // Live value (para mostrar)
        node.liveValue = Math.sin(Date.now() * 0.001 * (0.5 + node.id * 0.01)) * 0.5 + 0.5;
        
        // Disparar pulsos basado en activación
        if (node.activation > 0.7 && Math.random() < 0.02) {
          const connIdx = Math.floor(Math.random() * node.connections.length);
          const targetId = node.connections[connIdx];
          const target = nodes[targetId];
          if (target) spawnPulse(node, target, node.weights[connIdx]);
        }
      });
      
      // Input nodes: inyectar señal periódica
      nodes.filter(n => n.type === 'INPUT').forEach((node, i) => {
        node.targetActivation = 0.5 + 0.4 * Math.sin(Date.now() * 0.0005 + i);
      });
      
      // Anomaly nodes: disparan cuando hay anomalía simulada
      nodes.filter(n => n.type === 'ANOMALY').forEach(node => {
        if (Math.random() < 0.005) node.targetActivation = 1;
      });
    }

    // ========== ACTUALIZAR PULSOS ==========
    function updatePulses(dt) {
      for (let i = pulseParticles.length - 1; i >= 0; i--) {
        const p = pulseParticles[i];
        const { source, target, progress, speed } = p.userData;
        
        p.userData.progress += speed * dt * 60;
        
        if (p.userData.progress >= 1) {
          scene.remove(p);
          p.geometry.dispose();
          p.material.dispose();
          pulseParticles.splice(i, 1);
          
          // Activar target
          target.targetActivation = Math.min(1, target.targetActivation + 0.3 * Math.abs(p.userData.weight));
        } else {
          // Interpolar posición
          const sx = source.mesh.position.x, sy = source.mesh.position.y, sz = source.mesh.position.z;
          const tx = target.mesh.position.x, ty = target.mesh.position.y, tz = target.mesh.position.z;
          
          // Curva suave
          const t = p.userData.progress;
          const curveT = t * t * (3 - 2 * t); // smoothstep
          
          p.position.x = sx + (tx - sx) * curveT;
          p.position.y = sy + (ty - sy) * curveT + Math.sin(t * Math.PI) * 3; // arco
          p.position.z = sz + (tz - sz) * curveT;
          
          // Pulsar tamaño
          const pulseScale = 0.5 + 0.5 * Math.sin(t * Math.PI * 4);
          p.scale.setScalar(pulseScale);
          p.material.opacity = 0.8 * (1 - t);
        }
      }
    }

    // ========== ACTUALIZAR EDGES (GPU) ==========
    function updateEdges() {
      let edgeIdx = 0;
      
      edges.forEach(edge => {
        const source = nodes[edge.source];
        const target = nodes[edge.target];
        if (!source || !target) return;
        
        const sx = source.x, sy = source.y, sz = source.z;
        const tx = target.x, ty = target.y, tz = target.z;
        
        // Color basado en peso y actividad
        const activeIntensity = edge.active ? edge.pulse : 0;
        const baseOpacity = 0.15 + 0.3 * Math.abs(edge.weight);
        const pulseOpacity = activeIntensity * 0.6;
        const opacity = Math.min(1, baseOpacity + pulseOpacity);
        
        const r = edge.weight > 0 ? 0.34 : 0.94; // green/red
        const g = edge.weight > 0 ? 0.76 : 0.27;
        const b = edge.weight > 0 ? 0.23 : 0.27;
        
        // Source vertex
        edgePositions[edgeIdx * 6] = sx;
        edgePositions[edgeIdx * 6 + 1] = sy;
        edgePositions[edgeIdx * 6 + 2] = sz;
        edgeColors[edgeIdx * 6] = r;
        edgeColors[edgeIdx * 6 + 1] = g;
        edgeColors[edgeIdx * 6 + 2] = b;
        
        // Target vertex
        edgePositions[edgeIdx * 6 + 3] = tx;
        edgePositions[edgeIdx * 6 + 4] = ty;
        edgePositions[edgeIdx * 6 + 5] = tz;
        edgeColors[edgeIdx * 6 + 3] = r;
        edgeColors[edgeIdx * 6 + 4] = g;
        edgeColors[edgeIdx * 6 + 5] = b;
        
        // Decay pulse
        if (edge.pulse > 0) edge.pulse *= 0.95;
        if (edge.active && edge.pulse < 0.05) edge.active = false;
        
        edgeIdx++;
      });
      
      edgeGeometry.attributes.position.needsUpdate = true;
      edgeGeometry.attributes.color.needsUpdate = true;
      edgeGeometry.setDrawRange(0, edgeIdx * 2);
    }

    // ========== ACTUALIZAR NODOS VISUALES ==========
    function updateNodeVisuals() {
      nodes.forEach(node => {
        // Posición
        node.mesh.position.set(node.x, node.y, node.z);
        if (node.glow) node.glow.position.copy(node.mesh.position);
        if (node.labelSprite) node.labelSprite.position.set(node.x, node.y + node.typeDef.baseSize + 6, node.z);
        
        // Escala basada en activación
        const baseScale = node.typeDef.baseSize + Math.random() * 2;
        const activationScale = 1 + node.activation * 0.5;
        node.mesh.scale.setScalar(baseScale * activationScale);
        if (node.glow) node.glow.scale.setScalar(baseScale * activationScale * 1.5);
        
        // Emissive intensity
        node.mesh.material.emissiveIntensity = 0.3 + node.activation * 0.7;
        
        // Color shift para anomalías activas
        if (node.type === 'ANOMALY' && node.activation > 0.6) {
          node.mesh.material.color.setHex(0xef4444);
          node.mesh.material.emissive.setHex(0xef4444);
        } else {
          node.mesh.material.color.setHex(node.typeDef.color);
          node.mesh.material.emissive.setHex(node.typeDef.color);
        }
      });
    }

    // ========== RAYCASTING PARA HOVER ==========
    function handleHover(event) {
      const mouse = new THREE.Vector2(
        (event.clientX / window.innerWidth) * 2 - 1,
        -(event.clientY / window.innerHeight) * 2 + 1
      );
      
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(nodeGroup.children, false);
      
      const infoEl = document.getElementById('nodeInfo');
      
      if (intersects.length > 0) {
        const obj = intersects[0].object;
        if (obj.userData.nodeId !== undefined) {
          const node = nodes[obj.userData.nodeId];
          showNodeInfo(node);
          return;
        }
      }
      infoEl.classList.remove('visible');
    }
    
    function showNodeInfo(node) {
      const infoEl = document.getElementById('nodeInfo');
      infoEl.classList.add('visible');
      
      document.getElementById('infoName').textContent = `${node.typeDef.emoji} ${node.typeDef.label} #${node.id}`;
      document.getElementById('infoId').textContent = node.id;
      document.getElementById('infoType').textContent = node.typeDef.label;
      document.getElementById('infoActivation').textContent = node.activation.toFixed(3);
      document.getElementById('infoIn').textContent = adjacency.get(node.id)?.filter(id => nodes[id]?.layer < node.layer).length || 0;
      document.getElementById('infoOut').textContent = node.connections.length;
      document.getElementById('infoLive').textContent = node.liveValue.toFixed(3);
      document.getElementById('infoBias').textContent = node.bias.toFixed(2);
      document.getElementById('infoPos').textContent = `(${node.x.toFixed(1)}, ${node.y.toFixed(1)}, ${node.z.toFixed(1)})`;
    }

    canvas.addEventListener('mousemove', handleHover);
    canvas.addEventListener('touchmove', (e) => handleHover(e.touches[0]), { passive: true });

    // ========== CONTROLS UI ==========
    document.querySelectorAll('.controls .btn[data-mode]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.controls .btn[data-mode]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        applyLayout(btn.dataset.mode);
        document.getElementById('modeLabel').textContent = btn.textContent.replace(/[🌐🔮📐🌀]/, '').trim();
      });
    });
    
    document.getElementById('btnPause').addEventListener('click', (e) => {
      isPaused = !isPaused;
      e.target.textContent = isPaused ? '▶️ Reanudar' : '⏸️ Pausar';
      e.target.classList.toggle('active', isPaused);
    });
    
    document.getElementById('btnReset').addEventListener('click', () => {
      nodes.forEach(node => {
        node.x = (Math.random() - 0.5) * 200;
        node.y = (Math.random() - 0.5) * 200;
        node.z = (Math.random() - 0.5) * 200;
        node.vx = node.vy = node.vz = 0;
        node.activation = Math.random() * 0.3;
      });
      applyLayout(currentMode, true);
    });

    // ========== HUD UPDATE ==========
    function updateHUD() {
      const activeNodes = nodes.filter(n => n.activation > 0.3).length;
      const avgActivity = nodes.reduce((sum, n) => sum + n.activation, 0) / nodes.length;
      
      document.getElementById('nodeCount').textContent = nodes.length;
      document.getElementById('edgeCount').textContent = edges.length;
      document.getElementById('globalActivity').textContent = (avgActivity * 100).toFixed(1) + '%';
      document.getElementById('fps').textContent = fps;
    }

    // ========== ANIMATION LOOP ==========
    function animate(time) {
      requestAnimationFrame(animate);
      
      const dt = (time - lastTime) / 1000;
      lastTime = time;
      
      frameCount++;
      if (frameCount % 30 === 0) fps = Math.round(1 / dt);
      
      if (!isPaused) {
        simulateForces(dt * 60);
        updateNeural(dt * 60);
        updatePulses(dt * 60);
        updateEdges();
        updateNodeVisuals();
      }
      
      // Rotar estrellas lentamente
      stars.rotation.y += 0.00005;
      stars.rotation.x += 0.00002;
      
      // Mover luz puntual
      pointLight.position.x = Math.sin(time * 0.001) * 50;
      pointLight.position.z = Math.cos(time * 0.001) * 50;
      
      controls.update();
      renderer.render(scene, camera);
      
      if (frameCount % 10 === 0) updateHUD();
    }

    // ========== RESIZE ==========
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ========== START ==========
    animate(performance.now());
    
    // Auto-cambiar modo cada 30s para demo
    let modeIndex = 0;
    const modes = ['force', 'sphere', 'layers', 'spiral'];
    setInterval(() => {
      if (!isPaused) {
        modeIndex = (modeIndex + 1) % modes.length;
        applyLayout(modes[modeIndex]);
        document.querySelectorAll('.controls .btn[data-mode]').forEach(b => b.classList.toggle('active', b.dataset.mode === modes[modeIndex]));
        document.getElementById('modeLabel').textContent = modes[modeIndex];
      }
    }, 30000);
  </script>
</body>
