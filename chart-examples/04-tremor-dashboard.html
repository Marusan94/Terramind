<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tremor-style Dashboard (Vanilla)</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Inter', system-ui; margin: 0; background: #f8fafc; color: #1e293b; }
    .dashboard { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; }
    .sidebar { background: #fff; border-right: 1px solid #e2e8f0; padding: 24px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
    .main { padding: 32px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
    .header h1 { margin: 0; font-size: 1.75rem; font-weight: 700; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 32px; }
    .stat-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 24px; }
    .stat-label { font-size: 0.875rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
    .stat-value { font-size: 2.5rem; font-weight: 700; color: #1e293b; line-height: 1; }
    .stat-trend { font-size: 0.875rem; margin-top: 8px; display: flex; align-items: center; gap: 4px; }
    .trend-up { color: #22c55e; } .trend-down { color: #ef4444; }
    .charts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(500px, 1fr)); gap: 24px; }
    .chart-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 24px; }
    .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .chart-title { font-size: 1rem; font-weight: 600; }
    .chart-select { padding: 6px 12px; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 0.875rem; background: #fff; }
    .chart-canvas { height: 320px; }
    .nav-item { padding: 10px 12px; border-radius: 8px; cursor: pointer; color: #475569; margin-bottom: 4px; transition: all 0.15s; }
    .nav-item:hover { background: #f1f5f9; color: #1e293b; }
    .nav-item.active { background: #3b82f6; color: #fff; }
    .logo { font-weight: 800; font-size: 1.25rem; margin-bottom: 32px; color: #1e293b; display: flex; align-items: center; gap: 8px; }
  </style>
</head>
<body>
  <div class="dashboard">
    <aside class="sidebar">
      <div class="logo">🌤️ AirSense</div>
      <nav>
        <div class="nav-item active">📊 Dashboard</div>
        <div class="nav-item">🗺️ Mapa</div>
        <div class="nav-item">📈 Histórico</div>
        <div class="nav-item">🚨 Alertas</div>
        <div class="nav-item">⚙️ Configuración</div>
      </nav>
    </aside>
    <main class="main">
      <div class="header">
        <h1>Dashboard Calidad Aire</h1>
        <select class="chart-select"><option>Últimas 24h</option><option>Última semana</option><option>Último mes</option></select>
      </div>
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-label">PM2.5 Promedio</div><div class="stat-value">24.3</div><div class="stat-trend"><span class="trend-down">▼ 12%</span> vs ayer</div></div>
        <div class="stat-card"><div class="stat-label">PM10 Promedio</div><div class="stat-value">42.1</div><div class="stat-trend"><span class="trend-up">▲ 5%</span> vs ayer</div></div>
        <div class="stat-card"><div class="stat-label">Estaciones Activas</div><div class="stat-value">12</div><div class="stat-trend"><span class="trend-up">▲ 2</span> nuevas</div></div>
        <div class="stat-card"><div class="stat-label">Alertas Activas</div><div class="stat-value">3</div><div class="stat-trend"><span class="trend-down">▼ 1</span> resuelta</div></div>
      </div>
      <div class="charts-grid">
        <div class="chart-card">
          <div class="chart-header"><span class="chart-title">PM2.5 Serie Temporal</span></div>
          <canvas id="tsChart" class="chart-canvas"></canvas>
        </div>
        <div class="chart-card">
          <div class="chart-header"><span class="chart-title">Distribución por Hora</span></div>
          <canvas id="distChart" class="chart-canvas"></canvas>
        </div>
      </div>
    </main>
  </div>
  <script>
    // Time Series
    new Chart(document.getElementById('tsChart'), {
      type: 'line',
      data: {
        labels: Array.from({length:24},(_,i)=>`${i}:00`),
        datasets: [{
          label: 'PM2.5', data: [12,11,10,9,11,15,22,35,42,38,30,25,22,20,18,16,15,14,16,18,22,25,20,16],
          borderColor: '#ef4444', backgroundColor: 'rgba(239,68,68,0.08)', fill: true, tension: 0.3,
          pointRadius: 0, pointHoverRadius: 5, borderWidth: 2
        }]
      },
      options: { responsive: true, maintainAspectRatio: false, interaction: { intersect: false, mode: 'index' }, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { color: '#f1f5f9' } }, x: { grid: { display: false } } } }
    });

    // Distribution
    new Chart(document.getElementById('distChart'), {
      type: 'bar',
      data: {
        labels: Array.from({length:24},(_,i)=>`${i}:00`),
        datasets: [{
          label: 'PM2.5', data: [12,11,10,9,11,15,22,35,42,38,30,25,22,20,18,16,15,14,16,18,22,25,20,16],
          backgroundColor: (ctx) => { const v = ctx.raw; return v > 35 ? '#ef4444' : v > 20 ? '#f97316' : v > 15 ? '#f59e0b' : '#22c55e'; },
          borderRadius: 4
        }]
      },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { color: '#f1f5f9' } }, x: { grid: { display: false } } } }
    });
  </script>
</body>
</html>
